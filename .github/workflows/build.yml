# Builds the APK on GitHub and publishes it as a Release, so there's a
# permanent direct download link:
# https://github.com/Tajmalookcs/CalRec/releases/latest/download/CallRec.apk
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk CallRec.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CallRec-apk
          path: CallRec.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CallRec.apk \
            --title "CallRec (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install CallRec.apk on your phone."
