# Builds the APK on GitHub's servers, so you don't need a computer.
# Upload this project to a GitHub repo -> Actions tab -> "Build APK" -> Run.
# When it finishes, download "CallRec-apk" from the run page.
name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CallRec-apk
          path: app/build/outputs/apk/debug/app-debug.apk
